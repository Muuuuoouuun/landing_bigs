<!doctype html>
<html><head><meta charset="utf-8">
<style>
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #1a1d24; }
.plate { position: absolute; inset: 0; background-size: cover; background-position: center; }
.sky { background-image: url(../assets/gen/sky_dawn.jpg); filter: brightness(0.92); }
.town { background-image: url(../assets/gen/town_far.jpg); transform: translateY(70px) scale(1.12); filter: brightness(0.82) saturate(0.9);
  -webkit-mask-image: linear-gradient(to bottom, transparent 30%, #000 55%); }
.haze { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(255,214,170,0) 40%, rgba(255,214,170,0.18) 70%, rgba(40,40,60,0.25) 100%); }
.slot { position: absolute; overflow: hidden; }   /* bottom edge = the ground: houses rise out of it */
.slot .h { position: absolute; left: 0; bottom: 0; width: 100%; }
.slot img { position: absolute; left: 0; bottom: 0; width: 100%; display: block; }
.shadow { position: absolute; border-radius: 50%; background: radial-gradient(closest-side, rgba(10,12,20,0.55), rgba(10,12,20,0)); }
.sweep { position: absolute; left: -4%; width: 108%; height: 3px; border-radius: 2px; background: #F4FFE4;
  box-shadow: 0 0 10px 3px rgba(170,240,100,0.95), 0 0 34px 10px rgba(140,230,80,0.55); }
.slot img.glow { mix-blend-mode: screen; }
.lbl { position: absolute; left: 40px; top: 36px; font: 700 30px sans-serif; color: rgba(255,255,255,0.85); text-shadow: 0 2px 8px rgba(0,0,0,0.5); }
</style></head><body>
<div class="plate sky"></div><div class="plate town"></div><div id="world"></div><div class="haze"></div><div class="lbl" id="lbl"></div>
<script type="module">
// Look test (v8): houses rise as clay massing blocks, the pen's light sweeps up each one painting its texture, and
// its windows light. render(k) for k in 0..1 (the whole sequence).
import SPRITES from '../assets/gen/sprites.js';
const E = { outBack: x => 1 + 2.70158 * (x - 1) ** 3 + 1.70158 * (x - 1) ** 2, inOut: x => (x < 0.5 ? 4 * x * x * x : 1 - (-2 * x + 2) ** 3 / 2) };
const prog = (t, a, b) => Math.max(0, Math.min(1, (t - a) / (b - a)));
// two rows on a ground line: [sprite, x (centre), ground y, height px, start]
const ROW = [
  ['houses8_c_1', 300, 760, 420, 0.06], ['houses8_a_1', 720, 770, 330, 0.0], ['houses8_b_3', 1140, 765, 300, 0.1], ['houses8_c_3', 1560, 760, 430, 0.04],
  ['houses8_a_0', 520, 1010, 470, 0.16], ['houses8_b_1', 1000, 1020, 420, 0.24], ['houses8_a_3', 1460, 1015, 440, 0.2],
];
const world = document.getElementById('world');
const H = ROW.map(([id, cx, gy, hh, t0]) => {
  const m = SPRITES[`${id}.webp`], w = hh * (m.w / m.h);
  const sh = document.createElement('div'); sh.className = 'shadow';
  Object.assign(sh.style, { left: `${cx - w * 0.6}px`, top: `${gy - 34}px`, width: `${w * 1.2}px`, height: '60px' });
  const slot = document.createElement('div'); slot.className = 'slot';
  Object.assign(slot.style, { left: `${cx - w / 2}px`, top: `${gy - hh - 80}px`, width: `${w}px`, height: `${hh + 80}px` });
  const hd = document.createElement('div'); hd.className = 'h'; hd.style.height = `${hh}px`;
  const clay = new Image(); clay.src = `../assets/gen/${id}_clay.webp`;
  const base = new Image(); base.src = `../assets/gen/${id}.webp`;
  const lit = new Image(); lit.src = `../assets/gen/${id}_lit.webp`;
  const sweep = document.createElement('div'); sweep.className = 'sweep';
  const glow = new Image(); glow.className = 'glow'; glow.src = `../assets/gen/${id}_glow.webp`;
  hd.append(clay, base, lit, glow, sweep); slot.append(hd); world.append(sh, slot);
  return { hd, clay, base, lit, sweep, glow, sh, hh, t0 };
});
window.render = k => {
  for (const o of H) {
    const rise = E.outBack(prog(k, o.t0, o.t0 + 0.22));
    const paint = E.inOut(prog(k, o.t0 + 0.26, o.t0 + 0.46));
    const on = prog(k, 0.76 + o.t0 * 0.4, 0.86 + o.t0 * 0.4);
    o.hd.style.transform = `translateY(${((1 - rise) * (o.hh + 20)).toFixed(1)}px)`;
    o.sh.style.opacity = (0.3 + 0.7 * Math.min(1, rise)).toFixed(3);
    // texture painted from the ground up behind the pen's light
    o.base.style.clipPath = `inset(${((1 - paint) * 100).toFixed(2)}% 0 0 0)`;
    o.sweep.style.top = `${((1 - paint) * o.hh).toFixed(1)}px`;
    o.sweep.style.opacity = paint > 0 && paint < 1 ? '1' : '0';
    o.lit.style.opacity = on.toFixed(3);
    o.glow.style.opacity = (0.6 * on).toFixed(3);
  }
  document.getElementById('lbl').textContent = k < 0.28 ? '1 · 덩어리가 솟아오름' : k < 0.7 ? '2 · 빛이 훑으며 텍스처가 입혀짐' : k < 0.77 ? '3 · 완성된 집' : '4 · 창마다 불이 켜짐';
};
await Promise.all([...document.images].map(i => i.decode().catch(() => {})));
window.render(0.2);
window.ok = 1;
</script></body></html>
